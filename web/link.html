<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>callout — link banks</title>
<style>
:root{color-scheme:light dark}
body{font-family:-apple-system,sans-serif;max-width:480px;margin:3rem auto;padding:0 1rem}
button{font-size:1rem;padding:.5rem 1rem;cursor:pointer}
li{margin:.35rem 0}
small{color:#888}
.hidden{display:none}
</style>
<script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
</head>
<body>
<h1>callout</h1>
<p><a href="index.html">← dashboard</a></p>

<div id="needToken" class="hidden">
  <p>No app token found. Connect on the <a href="index.html">dashboard</a> first.</p>
</div>

<div id="main" class="hidden">
  <p>Linked institutions:</p><ul id="items"><li><small>Loading…</small></li></ul>
  <button onclick="start()">Link a new bank</button>
  <p id="msg"></p>
</div>

<script>
const API = "https://hkxerogzvowkyvdifbpn.supabase.co/functions/v1/plaid-link";
const token = localStorage.getItem("callout_token");
const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const msg = (t) => { document.getElementById("msg").textContent = t; };

const api = (body) => fetch(API, {
  method: body ? "POST" : "GET",
  headers: { "x-app-token": token, ...(body ? { "Content-Type": "application/json" } : {}) },
  ...(body ? { body: JSON.stringify(body) } : {}),
}).then((r) => r.json());

async function load() {
  if (!token) {
    document.getElementById("needToken").classList.remove("hidden");
    return;
  }
  document.getElementById("main").classList.remove("hidden");
  const { items } = await api();
  document.getElementById("items").innerHTML = (items ?? []).map((i) =>
    `<li>${esc(i.institution_name)} — ${esc(i.status)}` +
    (i.status !== "ok" ? ` <button onclick="start('${esc(i.id)}')">Re-link</button>` : "") +
    `</li>`
  ).join("") || "<li><small>None yet.</small></li>";
}

// OAuth banks bounce through the institution's site and return here with
// ?oauth_state_id=…; Link must then be re-initialized with the SAME link
// token and the full return URL. sessionStorage carries both across the hop.
function openLink(linkToken, updateItemId, receivedRedirectUri) {
  const handler = Plaid.create({
    token: linkToken,
    ...(receivedRedirectUri ? { receivedRedirectUri } : {}),
    onSuccess: async (public_token, metadata) => {
      sessionStorage.removeItem("callout_oauth_link");
      if (updateItemId) await api({ action: "relinked", item_id: updateItemId });
      else await api({ action: "exchange", public_token, institution: metadata.institution && metadata.institution.name });
      msg("Linked.");
      load();
    },
    onExit: (err) => {
      sessionStorage.removeItem("callout_oauth_link");
      if (err) msg("Exited: " + (err.display_message || err.error_code));
    },
  });
  handler.open();
}

async function start(updateItemId) {
  msg("");
  const r = await api({ action: "create_link_token", update_item_id: updateItemId });
  if (r.error) { msg("Error: " + r.error); return; }
  sessionStorage.setItem("callout_oauth_link", JSON.stringify({ link_token: r.link_token, update_item_id: updateItemId ?? null }));
  openLink(r.link_token, updateItemId);
}

function resumeOauth() {
  if (!new URLSearchParams(location.search).has("oauth_state_id")) return;
  const saved = sessionStorage.getItem("callout_oauth_link");
  if (!saved) { msg("OAuth return without a pending link session — start again."); return; }
  const { link_token, update_item_id } = JSON.parse(saved);
  openLink(link_token, update_item_id ?? undefined, window.location.href);
}

load();
resumeOauth();
</script>
</body>
</html>
