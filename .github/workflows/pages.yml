name: Deploy web (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "apps/accountability-web/**"
      - "apps/kingdom-web/**"
      - "packages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter @platform/accountability-web --filter @platform/kingdom-web
      - name: Assemble site (legacy at /, Accountability at /app, Kingdom at /kingdom)
        run: |
          mkdir -p site site/app site/kingdom
          cp -r web/* site/
          cp -r apps/accountability-web/out/* site/app/
          cp -r apps/kingdom-web/out/* site/kingdom/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
