name: Deploy platform API

on:
  push:
    branches: [main]
    paths: ["apps/api/**", "packages/**", "infra/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-west-2
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::897052629493:role/github-platform-deploy
          aws-region: us-west-2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build # workspace dists must exist for the Lambda bundle
      - name: Upsert platform secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PLAID_CLIENT_ID: ${{ secrets.PLAID_CLIENT_ID }}
          PLAID_SECRET: ${{ secrets.PLAID_SECRET }}
        run: |
          upsert() {
            aws secretsmanager describe-secret --secret-id "$1" >/dev/null 2>&1 \
              && aws secretsmanager put-secret-value --secret-id "$1" --secret-string "$2" >/dev/null \
              || aws secretsmanager create-secret --name "$1" --secret-string "$2" >/dev/null
          }
          for pair in "platform/database-url:$DATABASE_URL" "platform/plaid-client-id:$PLAID_CLIENT_ID" "platform/plaid-secret:$PLAID_SECRET"; do
            name="${pair%%:*}"; value="${pair#*:}"
            if [ -z "$value" ]; then echo "::error::repo secret for $name is not set"; exit 1; fi
            upsert "$name" "$value"
          done
          echo "secrets upserted"
      - name: CDK deploy
        working-directory: infra/cdk
        run: pnpm exec cdk deploy PlatformApi PlatformWorkers --require-approval never
